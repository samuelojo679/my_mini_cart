<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f1ea">
    <title>My Mini Cart - Shopping List Manager</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#items">Skip to item entry</a>
    <div class="app-shell">
        <header class="topbar">
            <div class="wordmark" aria-label="My Mini Cart">
                <span class="wordmark-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 5h2l2.1 9.2h9.8l2-6.2H6.2"></path>
                        <circle cx="9" cy="18" r="1"></circle>
                        <circle cx="16" cy="18" r="1"></circle>
                    </svg>
                </span>
                <span>My Mini Cart</span>
            </div>
            <div class="session-label">Personal list</div>
        </header>

        <main>
            <section class="page-heading" aria-labelledby="page-title">
                <h1 id="page-title">My shopping list</h1>
                <p>Add the essentials you need and keep everything clear, focused, and within reach.</p>
            </section>

            <section class="workspace" aria-label="Shopping list manager">
                <div class="entry-panel">
                    <div class="input-wrap">
                        <label for="items" hidden>Item name</label>
                        <input type="text" id="items" placeholder="Enter an item" autocomplete="off">
                    </div>
                    <button id="add_item" type="button" onclick="add()">Add item</button>
                </div>

                <div class="list-toolbar">
                    <div class="list-meta">
                        <span class="list-name">My list</span>
                        <span class="list-status">Ready</span>
                    </div>
                    <div class="utility-actions" aria-label="List actions">
                        <button id="dell_item" class="utility-button" type="button" onclick="deleteLastItem()" aria-label="Delete last item" title="Delete last item">
                            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path>
                            </svg>
                            <span>Delete last</span>
                        </button>
                        <button id="del_item" class="utility-button" type="button" onclick="deleteAll()" aria-label="Clear all items" title="Clear all items">
                            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path>
                            </svg>
                            <span>Clear all</span>
                        </button>
                    </div>
                </div>

                <div class="list-surface">
                    <div class="item-action-rail" aria-hidden="true"></div>
                    <div id="display" role="list" aria-live="polite"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
